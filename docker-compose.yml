version: "3.9"

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    ports:
      - "80:80"
    depends_on:
      - web
    volumes:
      - staticfiles:/var/www/static
    restart: always

  web:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    env_file: .env
    command: ["sh", "docker/web_entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - staticfiles:/var/www/static
    restart: always

  worker-app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    env_file: .env
    command: ["sh", "docker/celery_entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  worker-mail:
    build:
      context: .
      dockerfile: docker/mail.Dockerfile
    env_file: .env
    command: ["celery", "-A", "ssl_monitor", "worker", "-Q", "mail", "--loglevel=INFO"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 10s
      retries: 5
      timeout: 5s
      start_period: 10s

  db:
    image: postgres:15
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 10s
      retries: 5
      timeout: 5s
      start_period: 10s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      timeout: 5s
      start_period: 5s

volumes:
  pgdata:
  rabbit_data:
  staticfiles:
