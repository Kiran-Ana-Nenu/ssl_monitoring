version: "3.9"
services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    ports:
      - "80:80"
    depends_on:
      - web
    volumes:
      - staticfiles:/var/www/static
  web:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    env_file: .env
    depends_on:
      - db
      - rabbitmq
      - redis
    volumes:
      - ./src:/app/src:ro
      - staticfiles:/var/www/static
  worker-app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    command: celery -A ssl_monitor worker -Q default --loglevel=INFO
    env_file: .env
    volumes:
      - ./src:/app/src:ro
    depends_on:
      - rabbitmq
      - db
      - redis
  worker-mail:
    build:
      context: .
      dockerfile: docker/mail.Dockerfile
    env_file: .env
    depends_on:
      - rabbitmq
      - db
      - redis
    volumes:
      - ./src:/app/src:ro
  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbit_data:/var/lib/rabbitmq
  db:
    image: postgres:15
    restart: always
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  pgdata:
  rabbit_data:
  staticfiles:
