version: '3.9'

services:
  # ----------------------
  # PostgreSQL
  # ----------------------
  db:
    image: postgres:15
    container_name: ssl_monitor_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sslmon
      POSTGRES_USER: sslmonuser
      POSTGRES_PASSWORD: ChangeMeStrongPassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sslmonuser -d sslmon"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------
  # Redis
  # ----------------------
  redis:
    image: redis:7
    container_name: ssl_monitor_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------
  # RabbitMQ
  # ----------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: ssl_monitor_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: AdminPassword123
    healthcheck:
      test: ["CMD-SHELL", "rabbitmqctl status"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ----------------------
  # Django Web
  # ----------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ssl_monitor_web
    restart: unless-stopped
    command: ["/bin/sh", "/app/docker/web_entrypoint.sh"]
    volumes:
      - ./src:/app
      - ./docker/web_entrypoint.sh:/app/docker/web_entrypoint.sh
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      POSTGRES_DB: sslmon
      POSTGRES_USER: sslmonuser
      POSTGRES_PASSWORD: ChangeMeStrongPassword
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://admin:AdminPassword123@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ----------------------
  # Celery Worker
  # ----------------------
  worker-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ssl_monitor_worker_app
    restart: unless-stopped
    command: ["/bin/sh", "/app/docker/celery_entrypoint.sh"]
    volumes:
      - ./:/app
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      POSTGRES_DB: sslmon
      POSTGRES_USER: sslmonuser
      POSTGRES_PASSWORD: ChangeMeStrongPassword
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://admin:AdminPassword123@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ----------------------
  # Celery Mail Worker
  # ----------------------
  worker-mail:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ssl_monitor_worker_mail
    restart: unless-stopped
    command: ["/bin/sh", "/app/docker/celery_mail_entrypoint.sh"]
    volumes:
      - ./:/app
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      POSTGRES_DB: sslmon
      POSTGRES_USER: sslmonuser
      POSTGRES_PASSWORD: ChangeMeStrongPassword
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://admin:AdminPassword123@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
