version: "3.8"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ssl_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
  web:
    build: .
    command: bash -c "python manage.py migrate --noinput && gunicorn ssl_monitor.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ssl_monitor
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
  worker:
    build: .
    command: celery -A ssl_monitor worker -l info --concurrency=4
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - db
  beat:
    build: .
    command: celery -A ssl_monitor beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
volumes:
  postgres_data:
