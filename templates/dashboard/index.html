{% load static %}
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SSL Monitor — Dashboard</title>
  <script src="https://unpkg.com/htmx.org@1.9.2"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-4">
  <div class="max-w-5xl mx-auto">
    <h1 class="text-2xl font-bold mb-4">SSL Certificate Dashboard</h1>
    <table class="min-w-full bg-white shadow rounded">
      <thead>
        <tr>
          <th class="p-2">Domain</th>
          <th class="p-2">Expiry</th>
          <th class="p-2">Grade</th>
          <th class="p-2">Status</th>
          <th class="p-2">Actions</th>
        </tr>
      </thead>
      <tbody id="domains-table">
        {% for d in domains %}
          {% include "dashboard/_domain_row.html" with d=d %}
        {% empty %}
          <tr><td colspan="5" class="p-4">No domains added yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  <script>
    function startRowPolling(domainId, interval = 3000) {
      const row = document.getElementById('domain-row-' + domainId);
      if (!row) return;
      row.setAttribute('data-polling', 'true');
      const poll = () => {
        if (row.getAttribute('data-polling') !== 'true') return;
        fetch(`/dashboard/domain-row/${domainId}/`, {headers: {'HX-Request': 'true'}})
          .then(r => r.text())
          .then(html => {
            row.outerHTML = html;
            const newRow = document.getElementById('domain-row-' + domainId);
            if (newRow && newRow.dataset.inprogress === 'true') {
              setTimeout(() => startRowPolling(domainId, interval), interval);
            }
          }).catch(()=>{});
      };
      setTimeout(poll, interval);
    }
    document.addEventListener('click', function(e){
      if (e.target.matches('.check-now-btn')) {
        const domainId = e.target.dataset.domainId;
        e.target.disabled = true;
        e.target.innerHTML = `<svg class="inline w-4 h-4 animate-spin" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle></svg> Checking`;
        fetch(`/dashboard/check-now/${domainId}/`, {method:'POST', headers: {'X-CSRFToken': getCookie('csrftoken')} })
          .then(r => r.json())
          .then(j => {
            startRowPolling(j.domain_id);
          });
      }
    });
    function getCookie(name) {
      const v = document.cookie.match('(^|;)\s*' + name + '\s*=\s*([^;]+)');
      return v ? v.pop() : '';
    }
  </script>
</body>
</html>
